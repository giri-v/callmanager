<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Attendant - Settings</title>
</head>
<body>
    <h1>Settings</h1>
    <p>(This is a placeholder UI. Express.js is not available to serve dynamic content or a full frontend.)</p>

    <h2>Blocked Numbers</h2>
    <form>
        <input type="text" placeholder="Enter number to block">
        <button type="submit">Block</button>
    </form>
    <ul>
        <li>18005550000 (placeholder) <button>Delete</button></li>
    </ul>

    <h2>Permitted Numbers</h2>
    <form>
        <input type="text" placeholder="Enter number to permit">
        <button type="submit">Permit</button>
    </form>
    <ul>
        <li>15551234567 (placeholder) <button>Delete</button></li>
    </ul>

    <a href="/">Back to Voicemails</a>
</body>
</html>
